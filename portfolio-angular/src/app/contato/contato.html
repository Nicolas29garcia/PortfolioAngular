<div class="contato-container">

  <h1>Contato</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- NOME -->
    <div>
      <label for="nome">Nome</label>

      <input
        #nomeInput
        id="nome"
        type="text"
        formControlName="nome"
        placeholder="Seu nome"
        [attr.aria-invalid]="form.get('nome')?.invalid && form.get('nome')?.touched"
      />

      <p
        *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched"
        class="erro"
      >
        ⚠️ Informe um nome (mín. 3 letras).
      </p>
    </div>


    <!-- E-MAIL -->
    <div>
      <label for="email">E-mail</label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="seu@email.com"
        [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
      />

      <p
        *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
        class="erro"
      >
        ⚠️ E-mail inválido.
      </p>
    </div>


    <!-- MENSAGEM -->
    <div>
      <label for="mensagem">Mensagem</label>

      <textarea
        id="mensagem"
        formControlName="mensagem"
        placeholder="Digite sua mensagem"
        rows="5"
        [attr.aria-invalid]="form.get('mensagem')?.invalid && form.get('mensagem')?.touched"
      ></textarea>

      <p
        *ngIf="form.get('mensagem')?.invalid && form.get('mensagem')?.touched"
        class="erro"
      >
        ⚠️ Mensagem muito curta (mín. 10 caracteres).
      </p>
    </div>


    <!-- ERROS VINDOS DO BACK-END -->
    <div
      *ngIf="errosBack.length > 0"
      class="erro-back"
      role="alert"
    >

      <strong>⚠️ Não foi possível enviar:</strong>

      <ul>
        <li *ngFor="let erro of errosBack">
          {{ erro }}
        </li>
      </ul>

    </div>


    <!-- BOTÃO -->
    <button
      type="submit"
      [disabled]="form.invalid || enviando"
    >
      {{ enviando ? 'Enviando...' : 'Enviar' }}
    </button>


    <!-- SUCESSO -->
    <p
      *ngIf="sucesso"
      class="sucesso"
      role="status"
    >
      ✅ {{ sucesso }}
    </p>


    <!-- ERRO DE REDE -->
    <p
      *ngIf="erro"
      class="erro"
      role="alert"
    >
      ❌ {{ erro }}
    </p>

  </form>

</div>
